<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AES-256-GCM 加解密</title>
<style>
  :root{
    --bg:#0b0f1a;
    --card:#131a2b;
    --card2:#1a2338;
    --line:#26314d;
    --text:#e8edf7;
    --sub:#8b98b8;
    --accent:#4f7cff;
    --accent2:#6f9bff;
    --ok:#3ddc97;
    --warn:#ffb454;
    --bad:#ff5c7a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh;
    background:
      radial-gradient(1000px 600px at 15% -10%, #1b2a55 0%, transparent 60%),
      radial-gradient(900px 500px at 100% 0%, #2a1b45 0%, transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Helvetica Neue",system-ui,sans-serif;
    padding:24px 16px calc(40px + env(safe-area-inset-bottom));
    display:flex;
    justify-content:center;
  }
  .wrap{width:100%;max-width:640px}
  .title{
    display:flex;align-items:center;gap:10px;
    font-size:22px;font-weight:700;letter-spacing:.3px;
    margin:8px 0 4px;
  }
  .title .dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--ok);
    box-shadow:0 0 12px var(--ok);
    flex:0 0 auto;
  }
  .sub{color:var(--sub);font-size:13px;margin-bottom:20px;line-height:1.6}
  .card{
    background:linear-gradient(180deg,var(--card) 0%,var(--card2) 100%);
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px;
    margin-bottom:14px;
    box-shadow:0 8px 30px rgba(0,0,0,.35);
  }
  label{
    display:flex;justify-content:space-between;align-items:center;
    font-size:13px;font-weight:600;color:var(--sub);
    margin-bottom:8px;letter-spacing:.2px;
  }
  .strength{font-size:12px;font-weight:600}
  input,textarea{
    width:100%;
    background:#0e1524;
    border:1px solid var(--line);
    border-radius:10px;
    color:var(--text);
    font-size:15px;
    padding:12px 14px;
    outline:none;
    transition:border-color .15s,box-shadow .15s;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  input:focus,textarea:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(79,124,255,.18);
  }
  textarea{resize:vertical;min-height:110px;line-height:1.6}
  .btns{display:flex;gap:10px;margin-top:14px}
  button{
    flex:1;
    border:0;
    border-radius:12px;
    padding:14px 10px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    color:#fff;
    transition:transform .08s,filter .15s,opacity .15s;
    font-family:inherit;
  }
  button:active{transform:scale(.97)}
  .primary{background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 6px 18px rgba(79,124,255,.35)}
  .ghost{background:#1e2940;color:var(--sub);border:1px solid var(--line)}
  .ghost:hover{color:var(--text)}
  .hint{color:var(--sub);font-size:12px;margin-top:10px;line-height:1.6}
  .toast{
    position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);
    background:#1e2940;border:1px solid var(--line);
    color:var(--text);padding:12px 20px;border-radius:12px;
    font-size:14px;opacity:0;pointer-events:none;
    transition:opacity .25s,transform .25s;
    box-shadow:0 8px 30px rgba(0,0,0,.5);
    max-width:90vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.ok{border-color:var(--ok);color:var(--ok)}
  .toast.bad{border-color:var(--bad);color:var(--bad)}
</style>
</head>
<body>
<div class="wrap">

  <div class="title"><span class="dot"></span>AES-256-GCM 加解密</div>
  <div class="sub">密文格式：Base64( 16字节盐 + 12字节IV + 密文 )。每次加密结果都不同，属正常现象。</div>

  <div class="card">
    <label>密钥 / 密码 <span id="str" class="strength"></span></label>
    <input id="key" type="password" placeholder="双方约定的强密码" autocomplete="off" spellcheck="false">
  </div>

  <div class="card">
    <label>原文 / 密文</label>
    <textarea id="data" placeholder="输入要加密的内容，或粘贴收到的密文"></textarea>
  </div>

  <div class="btns">
    <button class="primary" onclick="encrypt()">加密</button>
    <button class="primary" onclick="decrypt()">解密</button>
  </div>

  <div class="card" style="margin-top:14px">
    <label>结果</label>
    <textarea id="out" readonly placeholder="结果显示在这里"></textarea>
    <div class="btns" style="margin-top:12px">
      <button class="ghost" onclick="copyOut()">复制结果</button>
      <button class="ghost" onclick="swap()">结果→输入</button>
      <button class="ghost" onclick="clearAll()">清空</button>
    </div>
  </div>

  <div class="hint">密钥仅在你本机参与计算，不会发送到任何服务器。忘记密码无法恢复。</div>
</div>

<div id="toast" class="toast"></div>

<script>
const enc = new TextEncoder();
const dec = new TextDecoder();
const ITER = 600000;

const $ = id => document.getElementById(id);

let toastTimer;
function toast(msg, type){
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (type || '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = 'toast ' + (type || ''); }, 2200);
}

async function deriveKey(password, salt){
  const baseKey = await crypto.subtle.importKey(
    'raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt, iterations:ITER, hash:'SHA-256' },
    baseKey,
    { name:'AES-GCM', length:256 },
    false,
    ['encrypt','decrypt']);
}

function bufToB64(buf){
  const b = new Uint8Array(buf);
  let s = '';
  const CHUNK = 0x8000;
  for(let i=0;i<b.length;i+=CHUNK){
    s += String.fromCharCode.apply(null, b.subarray(i, i+CHUNK));
  }
  return btoa(s);
}

function b64ToBuf(b64){
  const s = atob(b64);
  const b = new Uint8Array(s.length);
  for(let i=0;i<s.length;i++) b[i] = s.charCodeAt(i);
  return b;
}

async function encrypt(){
  const pw = $('key').value;
  const pt = $('data').value;
  if(!pw) return toast('请输入密钥', 'bad');
  if(!pt) return toast('请输入要加密的内容', 'bad');
  try{
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv   = crypto.getRandomValues(new Uint8Array(12));
    const key  = await deriveKey(pw, salt);
    const ct   = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, enc.encode(pt));

    const out = new Uint8Array(16 + 12 + ct.byteLength);
    out.set(salt, 0);
    out.set(iv, 16);
    out.set(new Uint8Array(ct), 28);

    $('out').value = bufToB64(out);
    toast('加密成功', 'ok');
  }catch(e){
    toast('加密失败：' + e.message, 'bad');
  }
}

async function decrypt(){
  const pw = $('key').value;
  const b64 = $('data').value.trim();
  if(!pw) return toast('请输入密钥', 'bad');
  if(!b64) return toast('请输入密文', 'bad');
  try{
    const raw = b64ToBuf(b64);
    if(raw.length < 29) throw new Error('密文长度不足');
    const salt = raw.slice(0, 16);
    const iv   = raw.slice(16, 28);
    const ct   = raw.slice(28);
    const key  = await deriveKey(pw, salt);
    const pt   = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct);
    $('out').value = dec.decode(pt);
    toast('解密成功', 'ok');
  }catch(e){
    toast('解密失败：密钥错误或密文损坏', 'bad');
  }
}

async function copyOut(){
  const v = $('out').value;
  if(!v) return toast('没有可复制的内容', 'bad');
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(v);
    }else{
      const ta = document.createElement('textarea');
      ta.value = v;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    toast('已复制', 'ok');
  }catch(e){
    toast('复制失败，请手动选择', 'bad');
  }
}

function swap(){
  const v = $('out').value;
  if(!v) return toast('结果为空', 'bad');
  $('data').value = v;
  $('out').value = '';
  toast('已移到输入框', 'ok');
}

function clearAll(){
  $('data').value = '';
  $('out').value = '';
}

function checkStrength(v){
  const el = $('str');
  if(!v){ el.textContent = ''; return; }
  let score = 0;
  if(v.length >= 8) score++;
  if(v.length >= 12) score++;
  if(v.length >= 16) score++;
  if(/[a-z]/.test(v) && /[A-Z]/.test(v)) score++;
  if(/\d/.test(v)) score++;
  if(/[^A-Za-z0-9]/.test(v)) score++;

  let text, color;
  if(score <= 2){ text = '弱'; color = 'var(--bad)'; }
  else if(score <= 4){ text = '中'; color = 'var(--warn)'; }
  else { text = '强'; color = 'var(--ok)'; }
  el.textContent = text;
  el.style.color = color;
}

$('key').addEventListener('input', e => checkStrength(e.target.value));

if(!window.crypto || !crypto.subtle){
  toast('当前环境不支持 Web Crypto，请用 https 或本地文件打开', 'bad');
}
</script>
</body>
</html>
